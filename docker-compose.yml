services:
  redis:
    image: redis:7-alpine
    container_name: students_life_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: students_life_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    volumes:
      - ./backend/staticfiles:/app/staticfiles
      - media_data:/app/media
      - ./backend/secrets:/app/secrets:ro
    ports:
      - "127.0.0.1:8103:8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      default:
      sl-services-internal:
        aliases:
          - students-life-internal
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/common/health/', timeout=5).read()\""]
      interval: 20s
      timeout: 7s
      retries: 10
      start_period: 60s

volumes:
  redis_data:
  media_data:

networks:
  sl-services-internal:
    external: true
