services:
  db:
    profiles: ["local-db"]

  backend:
    ports: !override
      - "127.0.0.1:8103:8000"
    depends_on: !override
      redis:
        condition: service_healthy
    networks:
      - default
      - sl_services_internal

networks:
  sl_services_internal:
    external: true
    name: sl-services-internal
